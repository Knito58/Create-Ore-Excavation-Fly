name: build
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Pinned commit of the unofficial Create Fly 26.3 port (the one the Villager Wake pack runs).
  # Pinned Create Fly commit. Bump deliberately when porting to a newer Create Fly.
  CREATE_FLY_REF: d28ff8220a3d2b83d433e41cc73eb0c81dad644f

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Probe Mod Menu and Cloth Config versions
        run: |
          curl -s https://maven.terraformersmc.com/releases/com/terraformersmc/modmenu/maven-metadata.xml | grep -E "<latest>|<release>|<version>2[0-9]\\." || true
          curl -s https://maven.shedaniel.me/me/shedaniel/cloth/cloth-config-fabric/maven-metadata.xml | grep -E "<latest>|<release>|<version>26\\." || true
      - name: Build Create Fly from source
        run: |
          git init /tmp/create-fly
          cd /tmp/create-fly
          git fetch --depth 1 https://github.com/zedekvdb/create-fly-unofficial-port.git "$CREATE_FLY_REF"
          git checkout --detach FETCH_HEAD
          chmod +x gradlew
          ./gradlew build -x test --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/libs"
          ls build/libs
          cp "$(ls build/libs/*.jar | grep -v -e sources -e server | head -n1)" "$GITHUB_WORKSPACE/libs/create-fly.jar"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/libs/create-fly.commit"
      - name: Build Ore Excavation Fly
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: create-ore-excavation-fly
          path: build/libs/*.jar
