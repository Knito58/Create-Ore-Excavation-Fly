name: build
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # Pinned commit of the unofficial Create Fly 26.3 port (the one the Villager Wake pack runs).
  # Pinned Create Fly commit. Bump deliberately when porting to a newer Create Fly.
  CREATE_FLY_REF: d28ff8220a3d2b83d433e41cc73eb0c81dad644f

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Create Fly from source
        run: |
          git init /tmp/create-fly
          cd /tmp/create-fly
          git fetch --depth 1 https://github.com/zedekvdb/create-fly-unofficial-port.git "$CREATE_FLY_REF"
          git checkout --detach FETCH_HEAD
          chmod +x gradlew
          ./gradlew build -x test --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/libs"
          ls build/libs
          cp "$(ls build/libs/*.jar | grep -v -e sources -e server | head -n1)" "$GITHUB_WORKSPACE/libs/create-fly.jar"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/libs/create-fly.commit"
      - name: Build Ore Excavation Fly
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: create-ore-excavation-fly
          path: build/libs/*.jar

  release:
    # Runs only for tags like v1.0.0: publishes the built jar to CurseForge (release type: release) and GitHub.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_PROJECT_ID: '1786938'
      CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: create-ore-excavation-fly
          path: dist
      - name: Pick the mod jar
        run: |
          JAR=$(ls dist/*.jar | grep -v -e sources -e dev | head -n1)
          echo "JAR=$JAR" >> "$GITHUB_ENV"
          ls -l dist
      - name: Upload to CurseForge
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" || { echo "Secret CURSEFORGE_TOKEN is missing"; exit 1; }
          API=https://minecraft.curseforge.com/api
          VERSIONS=$(curl -sSf -H "X-Api-Token: $CF_TOKEN" "$API/game/versions")
          # Minecraft 26.3, the Fabric loader, and Java 25 when CurseForge lists it
          IDS=$(echo "$VERSIONS" | jq -c '[.[] | select(.name=="26.3" or .name=="Fabric" or .name=="Java 25") | .id]')
          echo "game version ids: $IDS"
          echo "$VERSIONS" | jq -e '[.[] | select(.name=="26.3")] | length > 0' >/dev/null || { echo "CurseForge does not know Minecraft 26.3"; exit 1; }
          echo "$VERSIONS" | jq -e '[.[] | select(.name=="Fabric")] | length > 0' >/dev/null || { echo "CurseForge does not know the Fabric loader"; exit 1; }
          NAME="Create: Ore Excavation Fly ${GITHUB_REF_NAME#v}"
          META=$(jq -nc --arg name "$NAME" --argjson ids "$IDS" '{
            displayName: $name,
            releaseType: "release",
            changelogType: "markdown",
            changelog: "First release.\n\n- Ore veins in every world, vein types as JSON files\n- Ore Drill: single block, outputs into the vault, barrel or chest in front of it\n- Ore Vein Finder: radar that gets more precise when you get closer\n- Optional: Mod Menu and Cloth Config, Jade, JEI",
            gameVersions: $ids
          }')
          curl -sSf -H "X-Api-Token: $CF_TOKEN" \
            -F "metadata=$META" -F "file=@$JAR" \
            "$API/projects/$CF_PROJECT_ID/upload-file"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$JAR" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "First release. Requires Create Fly (unofficial 26.3 port) and Fabric API."
