plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.terraformersmc.com/releases" }
    maven { url = "https://maven.shedaniel.me" }
}

// Create Fly is built from source by CI and dropped into libs/create-fly.jar
// (it is not published to a Maven repository).
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly files("libs/create-fly.jar")
    // Optional: config screen via Mod Menu + Cloth Config (not required at runtime)
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE")
}
